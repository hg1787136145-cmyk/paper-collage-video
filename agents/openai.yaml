interface:
  display_name: "拼贴 B-roll"
  short_description: "隐喻确认→彩色静帧确认→Yijia 生成拼贴动画"
  default_prompt: "Use $paper-collage-video to 把这段文稿做成高级 halftone paper-collage B-roll。严格执行三阶段审批：先只给视觉隐喻并等待确认；确认后只生成彩色拼贴静帧并再次等待确认；静帧确认后默认使用 Yijia /v1/videos，一张图一条 prompt，生成 9:16 组装动画、contact sheet 和 ffprobe QA，不再询问模型，也不要默认调用 Veo。"
policy:
  allow_implicit_invocation: true
